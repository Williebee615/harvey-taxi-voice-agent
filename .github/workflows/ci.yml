name: Verifiable agent regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional hosted-console dependencies so no test is skipped
        run: python -m pip install modal fastapi httpx
      - name: Offline behavior and HTTP security tests (no keys, no API calls)
        run: ./helper test
      - name: JavaScript syntax
        run: node --check app.js
      - name: Modal console module imports
        run: python -c "import modal_console"
