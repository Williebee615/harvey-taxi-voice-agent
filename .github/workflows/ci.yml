name: Hackathon Verification (35/35 Checks)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 35/35 Verifiable Agent Tests
        run: node tests/run-tests.js
