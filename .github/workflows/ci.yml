name: Verifiable agent regression
on:
  push:
    branches: [main, codex/live-verifiable-agent]
  pull_request:
    branches: [main]
jobs:
  verify-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline behavior and HTTP security tests
        run: ./helper test
      - name: JavaScript syntax
        run: node --check app.js
      - name: Optional Modal adapter checks
        run: |
          python -m pip install modal fastapi httpx
          python -m unittest discover -s tests -p test_modal_console.py -v
          python -c "import modal_console"
