<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E7A"/>
      <stop offset="45%" stop-color="#1565D8"/>
      <stop offset="100%" stop-color="#19C6FF"/>
    </linearGradient>
    <linearGradient id="rightPillar" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071F5C"/>
      <stop offset="50%" stop-color="#0E68E6"/>
      <stop offset="100%" stop-color="#2CE5FF"/>
    </linearGradient>
    <linearGradient id="diagRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6FF"/>
      <stop offset="35%" stop-color="#1282F6"/>
      <stop offset="75%" stop-color="#0B3B9E"/>
      <stop offset="100%" stop-color="#25D8FF"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E68E6"/>
      <stop offset="100%" stop-color="#2CE5FF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="70" fill="#000000"/>
  <!-- Left vertical fold -->
  <path d="M122 145 C122 105, 152 95, 168 115 L192 225 C192 255, 182 280, 155 298 L122 320 Z" fill="url(#leftPillar)"/>
  <!-- Right vertical fold -->
  <path d="M312 155 C312 128, 338 110, 386 84 L386 296 C386 332, 355 348, 322 332 L312 315 Z" fill="url(#rightPillar)"/>
  <!-- Center 3D twisted diagonal ribbon -->
  <path d="M126 125 C146 86, 198 86, 232 132 L352 292 C372 320, 355 348, 315 340 C272 332, 236 290, 202 232 L138 135 Z" fill="url(#diagRibbon)"/>
  <!-- Specular glowing edge along twist -->
  <path d="M132 118 C164 98, 202 128, 245 192 L338 320" stroke="#9CF5FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Norel Ai Typography (with custom Lambda 'A') -->
  <text x="202" y="432" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-2">Norel</text>
  <!-- Stylized Cyan-Blue 'Ai' -->
  <path d="M346 432 L378 358 L396 358 L428 432 L406 432 L387 382 L368 432 Z" fill="url(#aiGrad)"/>
  <rect x="436" y="376" width="18" height="56" fill="url(#aiGrad)"/>
  <circle cx="445" cy="360" r="10" fill="#2CE5FF"/>
</svg>